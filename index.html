.login-card{width:min(420px,100%);background:rgba(255,255,255,.28);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:30px;border-radius:28px;text-align:center;border:1px solid rgba(255,255,255,.4);box-shadow:0 8px 32px rgba(0,0,0,.25)}
.logo{font-family:Georgia,serif;font-size:48px;color:#7d263d;font-weight:700}.sub{color:#7d263d;margin-top:-8px;margin-bottom:28px}
.field{display:block;width:100%;padding:15px;margin:10px 0;border:1px solid #ddd;border-radius:14px;background:#fff}
.primary{background:var(--pink);color:#fff;padding:15px 20px;border-radius:14px;font-weight:700;width:100%}
.primary:disabled{opacity:.5}
.app{display:none;min-height:100vh}.top{position:sticky;top:0;z-index:5;background:var(--pink);color:#fff;padding:16px 18px;display:flex;justify-content:space-between;align-items:center}.top h2{margin:0;font-size:20px}
main{padding:18px 18px 92px;max-width:700px;margin:auto}.welcome{background:linear-gradient(135deg,var(--pink),#ef6b8c);color:white;padding:20px;border-radius:20px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#fff;border:1px solid #eee;border-radius:16px;padding:15px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:20px;margin-top:5px}.red{color:var(--red)}.green{color:var(--green)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}.action{background:#fff;border:1px solid #eee;border-radius:16px;padding:15px 8px;text-align:center}.action b{display:block;margin-top:7px;font-size:13px}
.panel{background:#fff;border:1px solid #eee;border-radius:18px;padding:16px;margin-top:14px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.list{margin-top:10px}.item{padding:13px 0;border-bottom:1px solid #eee}.item:last-child{border-bottom:0}.badge{font-size:12px;padding:5px 8px;border-radius:10px;background:#ffe7ee;color:#a52e4f}.badge.ok{background:#e5f7ec;color:#187542}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:10}.nav button{background:none;color:#666;font-size:11px}.nav span{display:block;font-size:22px;margin-bottom:2px}.nav .active{color:var(--pink);font-weight:700}
.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;z-index:20}.sheet{background:#fff;border-radius:24px 24px 0 0;padding:20px;width:100%;max-width:700px;margin:auto;max-height:90vh;overflow:auto}.sheet h3{margin-top:0}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.syncdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ffe27a;margin-right:6px;vertical-align:middle}
.syncdot.ok{background:#8ef2a8}
@media(min-width:700px){.nav{left:50%;transform:translateX(-50%);max-width:700px;border-radius:18px 18px 0 0}.login-card{padding:40px}}
</style>
</head>

    <input id="user" class="field" placeholder="Usuário" value="admin">
    <input id="pass" class="field" type="password" placeholder="Senha" value="1234">
    <button class="primary" onclick="login()">ENTRAR</button>
    <p style="font-size:13px;color:#666"><span id="syncdot" class="syncdot ok"></span><span id="syncmsg">Sincronizado com a nuvem</span></p>
  </div>
</section>

 <button class="action" onclick="openSale()">➕<b>Registrar venda</b></button>
 <button class="action" onclick="show('clientes')">👥<b>Clientes</b></button>
 <button class="action" onclick="show('vendas')">📅<b>Movimento</b></button>
 <button class="action" onclick="show('financeiro')">💰<b>Fechamento</b></button>
 <button class="action" onclick="openProduct()">🍰<b>Produtos</b></button>
 <button class="action" onclick="show('financeiro')">📊<b>Pagamentos</b></button>
 </div></main>
<nav class="nav">
<button id="n-home" onclick="show('home')" class="active"><span>⌂</span>Início</button>
<button id="n-vendas" onclick="show('vendas')"><span>＋</span>Vendas</button>
<button id="n-clientes" onclick="show('clientes')"><span>♟</span>Clientes</button>
<button id="n-fin" onclick="show('financeiro')"><span>＄</span>Financeiro</button>
</nav>
</section>

<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, doc, deleteDoc, query, orderBy, onSnapshot, getDocs
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBV4dWzK2HlZdA6OblBCel2c_qTmkLcIKs",
  authDomain: "nono-doces.firebaseapp.com",
  projectId: "nono-doces",
  storageBucket: "nono-doces.firebasestorage.app",
  messagingSenderId: "679642406491",
  appId: "1:679642406491:web:e06783c1e9a44dd26fe97e"
};

const fbApp = initializeApp(firebaseConfig);
const fdb = getFirestore(fbApp);

let db = { products: [], clients: [], sales: [], payments: [] };
let currentPage = 'home';
let loaded = { products:false, clients:false, sales:false, payments:false };
let seeded = false;

function money(v){return (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}

async function seedDefaults(){
  if(seeded) return; seeded = true;
  const pSnap = await getDocs(collection(fdb,'products'));
  if(pSnap.empty){
    const defs=[{name:'Banoffee',price:13},{name:'Torta de bolacha',price:13},{name:'Morangonoffe',price:15}];
    for(const d of defs) await addDoc(collection(fdb,'products'),{...d,createdAt:Date.now()});
  }
  const cSnap = await getDocs(collection(fdb,'clients'));
  if(cSnap.empty){
    const defs=['João Silva','Zé Eleomar','Flores','Lucas Hasckel'];
    for(const n of defs) await addDoc(collection(fdb,'clients'),{name:n,createdAt:Date.now()});
  }
}

function markSynced(ok,msg){
  const dot=document.getElementById('syncdot'), m=document.getElementById('syncmsg');
  if(!dot) return;
  dot.classList.toggle('ok',ok);
  m.textContent = msg;
}

function listenCollection(name){
  const q = query(collection(fdb, name), orderBy('createdAt'));
  onSnapshot(q, snap=>{
    db[name] = snap.docs.map(d=>({id:d.id, ...d.data()}));
    loaded[name]=true;
    markSynced(true,'Sincronizado com a nuvem');
    if(Object.values(loaded).every(Boolean)){
      seedDefaults();
      rerender();
    }
  }, err=>{
    markSynced(false,'Sem conexão com a nuvem (verifique as regras do Firestore ou a internet)');
    console.error(name, err);
  });
}
['products','clients','sales','payments'].forEach(listenCollection);

function rerender(){ show(currentPage); }

function login(){
  if(document.getElementById('user').value && document.getElementById('pass').value){
    document.getElementById('login').style.display='none';
    document.getElementById('app').style.display='block';
    show('home');
  }
}
function logout(){document.getElementById('app').style.display='none';document.getElementById('login').style.display='flex'}
function setTitle(t){document.getElementById('title').textContent=t}
function nav(id){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));let e=document.getElementById('n-'+id);if(e)e.classList.add('active')}
function totals(){
 let sold=db.sales.reduce((s,x)=>s+x.total,0), paid=db.payments.reduce((s,x)=>s+x.value,0);
 return {sold,paid,open:sold-paid,qty:db.sales.reduce((s,x)=>s+x.qty,0)}
}
function show(page){
 currentPage = page;
 const c=document.getElementById('content'); nav(page==='home'?'home':page==='vendas'?'vendas':page==='clientes'?'clientes':'fin');
 if(page==='home'){setTitle('Nono Doces');let t=totals();c.innerHTML=`
 <div class="welcome"><b>Olá!</b><br>Controle diário de vendas e mensal dos clientes.</div>
 <div class="grid">
 <div class="stat"><small>Clientes ativos</small><strong>${db.clients.length}</strong></div>
 <div class="stat"><small>Doces vendidos</small><strong>${t.qty}</strong></div>
 <div class="stat"><small>Total vendido</small><strong>${money(t.sold)}</strong></div>
 <div class="stat"><small>Recebido (Pix)</small><strong class="green">${money(t.paid)}</strong></div>
 </div>
 <div class="stat" style="margin-top:10px"><small>Em aberto</small><strong class="red">${money(t.open)}</strong></div>
 <div class="cards">
 <button class="action" onclick="openSale()">➕<b>Registrar venda</b></button>
 <button class="action" onclick="show('clientes')">👥<b>Clientes</b></button>
 <button class="action" onclick="show('vendas')">📅<b>Movimento</b></button>
 <button class="action" onclick="show('financeiro')">💰<b>Fechamento</b></button>
 <button class="action" onclick="openProduct()">🍰<b>Produtos</b></button>
 <button class="action" onclick="show('financeiro')">📊<b>Pagamentos</b></button>
 </div>`}
 if(page==='vendas'){setTitle('Movimento');c.innerHTML=`<div class="row"><h3>Vendas registradas</h3><button class="primary" style="width:auto;padding:10px 14px" onclick="openSale()">+ Venda</button></div><div class="panel list">${db.sales.slice().reverse().map(s=>{let cl=db.clients.find(x=>x.id==s.clientId)?.name||'Cliente';let p=db.products.find(x=>x.id==s.productId)?.name||'Produto';return `<div class="item row"><div><b>${cl}</b><br><small>${s.date} • ${s.qty} × ${p}</small></div><div style="text-align:right">${money(s.total)}<br><span class="badge ${s.payment==='pix'?'ok':''}">${s.payment==='pix'?'Pago (Pix)':'Mensal'}</span><br><small style="color:#b23b3b" onclick="deleteSale('${s.id}')">Excluir</small></div></div>`}).join('')||'<p>Nenhuma venda ainda.</p>'}</div>`}
 if(page==='clientes'){setTitle('Clientes');c.innerHTML=`<div class="row"><h3>Clientes</h3><button class="primary" style="width:auto;padding:10px 14px" onclick="openClient()">+ Cliente</button></div><input class="field" id="search" placeholder="Buscar cliente..." oninput="renderClients()"><div id="clientList"></div>`;renderClients()}
 if(page==='financeiro'){setTitle('Fechamento mensal');let t=totals();c.innerHTML=`<div class="grid"><div class="stat"><small>Total vendido</small><strong>${money(t.sold)}</strong></div><div class="stat"><small>Recebido Pix</small><strong class="green">${money(t.paid)}</strong></div></div><div class="stat" style="margin-top:10px"><small>Em aberto</small><strong class="red">${money(t.open)}</strong></div><div class="panel"><h3>Pagamentos</h3>${db.payments.slice().reverse().map(p=>{let cl=db.clients.find(x=>x.id==p.clientId)?.name||'Cliente';return `<div class="item row"><div><b>${cl}</b><br><small>${p.date} • Pix</small></div><div style="text-align:right"><b class="green">${money(p.value)}</b><br><small style="color:#b23b3b" onclick="deletePayment('${p.id}')">Excluir</small></div></div>`}).join('')||'<p>Nenhum pagamento registrado.</p>'}</div><button class="primary" onclick="openPayment()">+ Registrar pagamento</button>`}
}
function renderClients(){let q=(document.getElementById('search')?.value||'').toLowerCase();let box=document.getElementById('clientList');box.innerHTML='<div class="panel">'+db.clients.filter(x=>x.name.toLowerCase().includes(q)||(x.nickname||'').toLowerCase().includes(q)||(x.phone||'').includes(q)).map(cl=>{let total=db.sales.filter(s=>s.clientId==cl.id).reduce((a,s)=>a+s.total,0);let paid=db.payments.filter(p=>p.clientId==cl.id).reduce((a,p)=>a+p.value,0);return `<div class="item row" onclick="clientDetail('${cl.id}')"><div><b>${cl.name}</b>${cl.nickname?' <small>('+cl.nickname+')</small>':''}<br><small>${money(total-paid)} em aberto</small></div><span>›</span></div>`}).join('')+'</div>'}
function openModal(body){document.getElementById('sheet').innerHTML=body;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function openSale(){openModal(`<h3>Registrar venda</h3><label>Data<input id="sdate" class="field" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Cliente<select id="sclient" class="field">${db.clients.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select></label><label>Produto<select id="sproduct" class="field" onchange="updateSaleTotal()">${db.products.map(x=>`<option value="${x.id}">${x.name} — ${money(x.price)}</option>`).join('')}</select></label><label>Quantidade<input id="sqty" class="field" type="number" min="1" value="1" oninput="updateSaleTotal()"></label><div class="stat"><small>Total</small><strong id="stotal">${money(db.products[0]?.price||0)}</strong></div><div class="twocol" style="margin-top:12px"><button class="primary" style="background:#555" onclick="saveSale('mensal')">MENSAL</button><button class="primary" style="background:#299b59" onclick="saveSale('pix')">PAGO NO PIX</button></div><button class="field" onclick="closeModal()">Cancelar</button>`)}
function updateSaleTotal(){let p=db.products.find(x=>x.id==document.getElementById('sproduct').value);let q=+document.getElementById('sqty').value||0;document.getElementById('stotal').textContent=money((p?.price||0)*q)}
async function saveSale(payment){
  let p=db.products.find(x=>x.id==document.getElementById('sproduct').value), q=+document.getElementById('sqty').value;
  if(!p||!q) return;
  const date=document.getElementById('sdate').value, clientId=document.getElementById('sclient').value, total=p.price*q;
  await addDoc(collection(fdb,'sales'),{date,clientId,productId:p.id,qty:q,total,payment,createdAt:Date.now()});
  if(payment==='pix') await addDoc(collection(fdb,'payments'),{date,clientId,value:total,createdAt:Date.now()});
  closeModal(); show('vendas');
}
function openClient(){openModal(`<h3>Novo cliente</h3><input id="cname" class="field" placeholder="Nome do cliente"><input id="cnick" class="field" placeholder="Apelido (opcional)"><input id="cphone" class="field" type="tel" placeholder="Telefone / WhatsApp (opcional)"><button class="primary" onclick="saveClient()">SALVAR</button><button class="field" onclick="closeModal()">Cancelar</button>`)}
async function saveClient(){let n=document.getElementById('cname').value.trim(),nick=document.getElementById('cnick').value.trim(),phone=document.getElementById('cphone').value.trim();if(n){await addDoc(collection(fdb,'clients'),{name:n,nickname:nick,phone:phone,createdAt:Date.now()});closeModal();show('clientes')}}
function openProduct(){openModal(`<h3>Novo produto</h3><input id="pname" class="field" placeholder="Nome do produto"><input id="pprice" class="field" type="number" step=".01" placeholder="Preço (R$)"><button class="primary" onclick="saveProduct()">SALVAR</button><button class="field" onclick="closeModal()">Cancelar</button>`)}
async function saveProduct(){let n=document.getElementById('pname').value.trim(),v=+document.getElementById('pprice').value;if(n&&v){await addDoc(collection(fdb,'products'),{name:n,price:v,createdAt:Date.now()});closeModal();show('home')}}
function normalizePhone(raw){if(!raw) return ''; let d=raw.replace(/\D/g,''); if(d.length===10||d.length===11) d='55'+d; return d}
function shareWhatsApp(id){
  let cl=db.clients.find(x=>x.id===id); if(!cl) return;
  let sales=db.sales.filter(s=>s.clientId===id);
  let paid=db.payments.filter(p=>p.clientId===id).reduce((a,p)=>a+p.value,0);
  let qty=sales.reduce((a,s)=>a+s.qty,0);
  let total=sales.reduce((a,s)=>a+s.total,0);
  let open=total-paid;
  let msg=`Olá ${cl.name}! Aqui é da Nono Doces 🍰\n\nSegue o resumo do seu pedido:\n📦 ${qty} doce(s)\n💰 Valor total: ${money(open)}\n\nChave Pix: 05608812905\nJosé Paulo Massoline Beirão\nBanco: Caixa Econômica Federal`;
  let phone=normalizePhone(cl.phone);
  let url=(phone?`https://wa.me/${phone}`:'https://wa.me/')+`?text=${encodeURIComponent(msg)}`;
  window.open(url,'_blank');
}
async function deleteClient(id){
  let cl=db.clients.find(x=>x.id===id); if(!cl) return;
  if(confirm(`Tem certeza que deseja excluir o cliente "${cl.name}"? Essa ação não pode ser desfeita.`)){
    await deleteDoc(doc(fdb,'clients',id));
    closeModal(); show('clientes');
  }
}
function clientDetail(id){let cl=db.clients.find(x=>x.id==id),sales=db.sales.filter(s=>s.clientId==id),paid=db.payments.filter(p=>p.clientId==id).reduce((a,p)=>a+p.value,0),total=sales.reduce((a,s)=>a+s.total,0);openModal(`<h3>${cl.name}${cl.nickname?' ('+cl.nickname+')':''}</h3><div class="grid"><div class="stat"><small>Total</small><strong>${money(total)}</strong></div><div class="stat"><small>Em aberto</small><strong class="red">${money(total-paid)}</strong></div></div><div class="panel"><h4>Histórico</h4>${sales.map(s=>{let p=db.products.find(x=>x.id==s.productId);return `<div class="item row"><span>${s.date}<br><small>${s.qty} × ${p?.name||'Produto'}</small></span><b>${money(s.total)}</b></div>`}).join('')||'<p>Sem compras.</p>'}</div><button class="primary" onclick="closeModal();openPayment('${id}')">REGISTRAR PAGAMENTO</button><button class="primary" style="background:#25D366;margin-top:8px" onclick="shareWhatsApp('${id}')">COMPARTILHAR NO WHATSAPP</button><button class="primary" style="background:#b23b3b;margin-top:8px" onclick="deleteClient('${id}')">EXCLUIR CLIENTE</button><button class="field" onclick="closeModal()">Fechar</button>`)}
function openPayment(pref){openModal(`<h3>Registrar pagamento</h3><select id="payclient" class="field">${db.clients.map(x=>`<option value="${x.id}" ${x.id===pref?'selected':''}>${x.name}</option>`).join('')}</select><input id="payvalue" class="field" type="number" step=".01" placeholder="Valor recebido"><input id="paydate" class="field" type="date" value="${new Date().toISOString().slice(0,10)}"><button class="primary" onclick="savePayment()">SALVAR PAGAMENTO (PIX)</button><button class="field" onclick="closeModal()">Cancelar</button>`)}
async function savePayment(){let v=+document.getElementById('payvalue').value;if(v>0){await addDoc(collection(fdb,'payments'),{clientId:document.getElementById('payclient').value,value:v,date:document.getElementById('paydate').value,createdAt:Date.now()});closeModal();show('financeiro')}}

async function deletePayment(id){
  if(confirm('Tem certeza que deseja excluir esse pagamento? Essa ação não pode ser desfeita.')){
    await deleteDoc(doc(fdb,'payments',id));
  }
}
async function deleteSale(id){
  if(confirm('Tem certeza que deseja excluir essa venda? Essa ação não pode ser desfeita.')){
    await deleteDoc(doc(fdb,'sales',id));
  }
}

// expõe as funções usadas nos onclick/oninput do HTML
Object.assign(window,{login,logout,show,openSale,updateSaleTotal,saveSale,openClient,saveClient,openProduct,saveProduct,clientDetail,openPayment,savePayment,closeModal,renderClients,deleteClient,shareWhatsApp,deletePayment,deleteSale});
</script>


</body></html>
